id: J-GD-003
title: Measurement units and exact numeric placement
covers: [GD-04, GD-05]
steps:
  - new_document: {width: 210mm, height: 297mm}
  - set_units: {units: mm}
  - expect: {query: {q: session}, path: /units, equals: mm}
  - add_shape: {page: 0, rect: [20mm, 30mm, 50mm, 25mm], kind: rect, fill: "#000000"}
    as: r
  # positions are reported in the chosen display unit, stored in points
  - expect: {query: {q: object_geometry, id: $r}, equals: {x: "20 mm", y: "30 mm", w: "50 mm", h: "25 mm", rotation: "0°"}}
  - set_units: {units: in}
  - expect: {query: {q: object_geometry, id: $r}, path: /x, equals: "0.79 in"}
  - set_units: {units: pi}
  - expect: {query: {q: object_geometry, id: $r}, path: /w, equals: "11p9.73"}
  # entering geometry as text in any unit
  - set_geometry: {id: $r, x: "1in", w: "6p"}
  - expect: {query: {q: object, id: $r}, path: /rect/x, equals: 72}
  - expect: {query: {q: object, id: $r}, path: /rect/w, equals: 72}
  - expect_error: {set_geometry: {id: $r, x: "abc"}}
