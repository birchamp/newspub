id: J-TY-002
title: Paragraph alignment — left, centre, right, justify
covers: [TY-02]
steps:
  - new_document: {width: 8.5in, height: 11in}
  # 4in wide frame, 0.08in insets → text area x 5.76 .. 282.24 (frame-local)
  - add_text_frame: {page: 0, rect: [1in, 1in, 4in, 6in]}
    as: f
  - insert_text: {target: $f, text: "Short centred line\nShort right line\nThis justified paragraph is long enough to wrap onto several lines so that every line except the last is stretched to both edges of the frame.\nLeft line"}
  - format_paras: {target: $f, start: 0, end: 1, attrs: {align: center}}
  - format_paras: {target: $f, start: 20, end: 21, attrs: {align: right}}
  - format_paras: {target: $f, start: 40, end: 41, attrs: {align: justify}}
  - expect: {query: {q: para_attrs, target: $f, at: 0}, path: /align, equals: center}
  - expect: {query: {q: para_attrs, target: $f, at: 180}, path: /align, equals: left}
  # centred: equal space on both sides (within 1pt)
  - let: {l0: {q: frame_lines, frame: $f}}
  - expect: {query: {q: frame_lines, frame: $f}, path: /0/text, starts_with: "Short centred line"}
  - expect: {query: {q: frame_lines, frame: $f}, path: /0/ink_left, gt: 60}
  # right: ends at the right edge
  - expect: {query: {q: frame_lines, frame: $f}, path: /1/ink_right, approx: [282.24, 1.0]}
  - expect: {query: {q: frame_lines, frame: $f}, path: /1/ink_left, gt: 150}
  # justified: first lines span the whole width, the last line of the paragraph does not
  - expect: {query: {q: frame_lines, frame: $f}, path: /2/ink_left, approx: [5.76, 0.5]}
  - expect: {query: {q: frame_lines, frame: $f}, path: /2/ink_right, approx: [282.24, 1.0]}
  - expect: {query: {q: frame_lines, frame: $f}, path: /3/ink_right, approx: [282.24, 1.0]}
  # left: starts at the left inset
  - expect: {query: {q: frame_lines, frame: $f}, path: /5/text, equals: "Left line"}
  - expect: {query: {q: frame_lines, frame: $f}, path: /5/ink_left, approx: [5.76, 0.5]}
  - expect: {query: {q: frame_lines, frame: $f}, path: /4/ink_right, lt: 270}
  - snapshot: {page: 0, name: aligned, dpi: 96}
