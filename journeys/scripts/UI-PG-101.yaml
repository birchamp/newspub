id: UI-PG-101
title: Pages and guides — reorder and duplicate pages from the page list; drag guides out of the rulers, move them, drag them back to remove
covers: [UI-21]
ui: true
steps:
  - click: {label: "Text Box"}
  - drag: {from: [1in, 1in], to: [4in, 2in]}
  - type: {text: "Alpha"}
  - key: {key: "Escape"}
  - click: {label: "Add Page"}
  - expect: {query: {q: page_count}, equals: 2}
  - expect: {query: {q: view}, path: /page, equals: 1}
  - click: {label: "Text Box"}
  - drag: {from: [1in, 1in], to: [4in, 2in]}
  - type: {text: "Beta"}
  - key: {key: "Escape"}
  # right-click a page in the page list
  - click: {label: "Page 2", button: secondary}
  - click: {label: "Move Page Up"}
  - expect: {query: {q: find, text: "Beta"}, path: /0/story, gt: 0, as: b}
  - expect: {query: {q: char_page, target: $b, at: 0}, equals: 0}
  - expect: {query: {q: find, text: "Alpha"}, path: /0/story, gt: 0, as: a}
  - expect: {query: {q: char_page, target: $a, at: 0}, equals: 1}
  - click: {label: "Page 2", button: secondary}
  - click: {label: "Duplicate Page"}
  - expect: {query: {q: page_count}, equals: 3}
  - expect: {query: {q: find, text: "Alpha"}, len: 2}
  - click: {label: "Page 1", button: secondary}
  - click: {label: "Move Page Down"}
  - expect: {query: {q: char_page, target: $b, at: 0}, equals: 1}
  # guides: drag one out of the top ruler onto the page
  - click: {label: "Page 1"}
  - drag: {from_ruler: top, to: [4in, 3in]}
  - expect: {query: {q: document}, path: /guides/ruler, len: 1}
  - expect: {query: {q: document}, path: /guides/ruler/0/orientation, equals: "horizontal"}
  - expect: {query: {q: document}, path: /guides/ruler/0/pos, approx: [216, 2]}
  # drag the guide to move it (away from any object)
  - drag: {from: [6in, 3in], to: [6in, 5in]}
  - expect: {query: {q: document}, path: /guides/ruler/0/pos, approx: [360, 2]}
  # a vertical guide from the left ruler
  - drag: {from_ruler: left, to: [2in, 7in]}
  - expect: {query: {q: document}, path: /guides/ruler, len: 2}
  - expect: {query: {q: document}, path: /guides/ruler/1/orientation, equals: "vertical"}
  - expect: {query: {q: document}, path: /guides/ruler/1/pos, approx: [144, 2]}
  # dragging a guide back onto its ruler removes it
  - drag: {from: [6in, 5in], to_ruler: top}
  - expect: {query: {q: document}, path: /guides/ruler, len: 1}
  # guides do not get in the way of selecting objects
  - click_at: [2.5in, 1.5in]
  - expect: {query: {q: view}, path: /selection, len: 1}
