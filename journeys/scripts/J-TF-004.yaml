id: J-TF-004
title: A5 booklet — two linked frames, paste three pages of text, autoflow to page 4, export 8 pages with crop marks
covers: [TF-05, TF-03, PR-03]
steps:
  - new_document: {width: 148mm, height: 210mm, pages: 2, facing: true, bleed: 3mm, margins: {top: 15mm, bottom: 15mm, inside: 15mm, outside: 12mm}}
  - add_text_frame: {page: 0, rect: [15mm, 15mm, 121mm, 180mm]}
    as: f1
  - add_text_frame: {page: 1, rect: [12mm, 15mm, 121mm, 180mm]}
    as: f2
  - link_frames: {from: $f1, to: $f2}
  - insert_text: {target: $f1, text: "@file:fixtures/three-pages.txt"}
  - expect: {query: {q: overflow, target: $f1}, equals: true}
  - autoflow: {frame: $f2}
  - expect: {query: {q: overflow, target: $f1}, equals: false}
  # the story now fills three pages and ends on page 4 (index 3)
  - expect: {query: {q: page_count}, equals: 4}
  - expect: {query: {q: story_frames, target: $f1}, len: 4}
  - let: {n: {q: story_length, target: $f1}}
  - expect: {query: {q: char_page, target: $f1, at: 0}, equals: 0}
  - expect: {query: {q: char_page, target: $f1, at: "$n-1"}, equals: 3}
  - expect: {query: {q: frame_lines, frame: $f2}, len: {gt: 20}}
  # pad to 8 pages and export with crop marks
  - insert_pages: {count: 4}
  - expect: {query: {q: page_count}, equals: 8}
  - export_pdf: {path: booklet-pages.pdf, options: {bleed: true, crop_marks: true}}
  - expect_pdf:
      file: booklet-pages.pdf
      pages: 8
      text_contains: ["New mayor library hall"]
      fonts: {contains: ["Carlito"], embedded: true}
      boxes:
        - {page: 1, trim: [34.50, 34.50, 454.03, 629.78], bleed: [26.0, 26.0, 462.54, 638.28]}
      ink:
        # top-left crop marks lie outside the bleed, in the slug area
        - {page: 1, rect: [3, 33.5, 16, 2], min: 0.1}
        - {page: 1, rect: [33.5, 3, 2, 16], min: 0.1}
        # nothing printed in the slug except marks
        - {page: 1, rect: [0, 0, 20, 20], max: 0.0}
  - expect_roundtrip: {}
