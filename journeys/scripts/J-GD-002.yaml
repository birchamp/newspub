id: J-GD-002
title: Snap to guides, margins, and other objects when moving and resizing
covers: [GD-03]
steps:
  - new_document: {width: 8.5in, height: 11in, margins: {top: 0.5in, bottom: 0.5in, left: 0.5in, right: 0.5in}}
  - add_guide: {page: 0, orientation: vertical, pos: 4in}
  - add_shape: {page: 0, rect: [5in, 5in, 1in, 1in], kind: rect, fill: "#00aa00"}
    as: other
  # a proposed rect whose left edge is 3pt from the 4in guide snaps onto it (default snap distance 6pt)
  - expect: {query: {q: snap, page: 0, rect: [291, 300, 72, 72]}, path: /rect, equals: {x: 288, y: 300, w: 72, h: 72}}
  # right edge near the guide snaps too
  - expect: {query: {q: snap, page: 0, rect: [213, 300, 72, 72]}, path: /rect/x, equals: 216}
  # near the left margin
  - expect: {query: {q: snap, page: 0, rect: [40, 100, 50, 50]}, path: /rect/x, equals: 36}
  # aligns with another object's top edge
  - expect: {query: {q: snap, page: 0, rect: [100, 357, 50, 50]}, path: /rect/y, equals: 360}
  # far from everything: unchanged; and the snapped-to lines are reported
  - expect: {query: {q: snap, page: 0, rect: [150, 150, 50, 50]}, path: /rect, equals: {x: 150, y: 150, w: 50, h: 50}}
  - expect: {query: {q: snap, page: 0, rect: [291, 300, 72, 72]}, path: /lines, equals: [{orientation: vertical, pos: 288}]}
  # the moved object itself is ignored, snapping can be turned off
  - expect: {query: {q: snap, page: 0, rect: [362, 362, 72, 72], ignore: [$other]}, path: /rect/x, equals: 362}
  - set_snapping: {enabled: false}
  - expect: {query: {q: snap, page: 0, rect: [291, 300, 72, 72]}, path: /rect/x, equals: 291}
