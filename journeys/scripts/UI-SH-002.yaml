id: UI-SH-002
title: Through the UI — new A5 publication, draw a text box, type, export PDF
covers: [UI-02]
ui: true
steps:
  - click: {label: "New"}
  - expect_ui: {label: "Page width"}
  - click: {label: "A5"}
  - click: {label: "Create"}
  - expect_ui: {label: "Page width", exists: false}
  - expect: {query: {q: document}, path: /setup/width, approx: [419.53, 0.05]}
  - click: {label: "Text Box"}
  - drag: {from: [1in, 1in], to: [5in, 3in]}
  - expect: {query: {q: object_count, page: 0}, equals: 1}
  - let: {frame: {q: page_objects, page: 0}}
  - expect: {query: {q: page_objects, page: 0}, len: 1}
  - expect: {query: {q: document}, path: /pages/0/objects/0, gt: 0, as: fid}
  - expect: {query: {q: object, id: $fid}, path: /rect/x, approx: [72, 2]}
  - expect: {query: {q: object, id: $fid}, path: /rect/w, approx: [288, 3]}
  - type: {text: "Hello from the UI"}
  - expect: {query: {q: story_text, target: $fid}, equals: "Hello from the UI"}
  # typing is one undo step
  - expect: {query: {q: history}, path: /undo, equals: 2}
  - click: {label: "Bold"}
  - expect: {query: {q: char_attrs, target: $fid, at: 0}, path: /bold, equals: true}
  - click: {label: "Export PDF"}
  - fill: {label: "PDF file", text: "ui.pdf"}
  - click: {label: "Export"}
  - expect_pdf:
      file: ui.pdf
      pages: 1
      page_size: {w: 419.53, h: 595.28}
      text_contains: ["Hello from the UI"]
      fonts: {contains: ["Carlito-Bold"], embedded: true}
