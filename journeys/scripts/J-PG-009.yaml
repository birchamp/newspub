id: J-PG-009
title: Date fields show the current date in long, short, ISO and day-month-year formats (the runner fixes the date to 2026-05-01)
covers: [PG-06]
steps:
  - new_document: {width: 8.5in, height: 11in}
  - add_text_frame: {page: 0, rect: [1in, 1in, 6in, 1in]}
    as: f
  - insert_text: {target: $f, text: "Printed "}
  - insert_field: {target: $f, at: 8, field: {date: long}}
  - expect: {query: {q: frame_text, frame: $f}, equals: "Printed May 1, 2026"}
  - add_text_frame: {page: 0, rect: [1in, 3in, 6in, 1in]}
    as: g
  - insert_field: {target: $g, at: 0, field: {date: iso}}
  - insert_text: {target: $g, text: " | "}
  - insert_field: {target: $g, at: 4, field: {date: short}}
  - insert_text: {target: $g, text: " | "}
  - insert_field: {target: $g, at: 8, field: {date: day_month_year}}
  - expect: {query: {q: frame_text, frame: $g}, equals: "2026-05-01 | 5/1/2026 | 1 May 2026"}
  - export_pdf: {path: dated.pdf}
  - expect_pdf: {file: dated.pdf, text_contains: ["Printed May 1, 2026"]}
