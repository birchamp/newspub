[package]
name = "newpub-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
newpub-core.workspace = true
newpub-engine.workspace = true
newpub-io-pdf.workspace = true
newpub-agent.workspace = true
eframe.workspace = true
egui.workspace = true
serde_json.workspace = true
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The same versions eframe uses: newpub owns the event loop on macOS to receive "open document" events.
winit = { version = "=0.30.13", default-features = false }
objc2 = "=0.5.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_Xps",
] }
