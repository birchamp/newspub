name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  journeys:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
          - { os: windows-latest, label: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - name: fmt
        id: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: clippy
        id: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        id: build
        run: cargo build --workspace --release
      - name: journeys
        id: journeys
        continue-on-error: true
        run: cargo run -p newpub-journeys --release -- --out target/journeys --os ${{ matrix.label }}
      - name: record job status
        if: always()
        shell: bash
        run: |
          mkdir -p target/journeys
          cat > target/journeys/job-status.json <<JSON
          {"os": "${{ matrix.label }}", "fmt": "${{ steps.fmt.outcome }}", "clippy": "${{ steps.clippy.outcome }}",
           "build": "${{ steps.build.outcome }}", "journeys": "${{ steps.journeys.outcome }}",
           "run_id": "${{ github.run_id }}", "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "sha": "${{ github.sha }}", "ref": "${{ github.ref_name }}"}
          JSON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-results-${{ matrix.label }}
          path: target/journeys
          if-no-files-found: warn
      - name: fail if journeys failed
        if: steps.journeys.outcome != 'success'
        run: exit 1

  conformance:
    # Independent validators on journey output: veraPDF (PDF/UA-1), epubcheck, libgxps (XPS) and a real print
    # hand-off through CUPS to a virtual PDF printer.
    needs: journeys
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libgxps-utils poppler-utils cups cups-pdf default-jre-headless
          sudo systemctl start cups || sudo service cups start
          sudo lpadmin -d PDF || true
          lpstat -t || true
      - uses: actions/download-artifact@v4
        with:
          name: journey-results-linux
          path: ci-results/linux
      - name: build
        run: cargo build -p newpub-journeys --release
      - name: conformance checks
        run: tools/conformance/run.sh ci-results/linux target/conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: target/conformance
          if-no-files-found: warn

  native-print:
    # Real print jobs through the native print paths: GDI to "Microsoft Print to PDF" on Windows (plus XPS
    # read back by Windows' own XPS reader), CUPS to a file-device queue on macOS.
    name: native-print-${{ matrix.label }}
    needs: journeys
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macos }
          - { os: windows-latest, label: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build -p newpub-journeys --release
      - name: Windows printer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Start-Service Spooler
          if (-not (Get-Printer -Name "Microsoft Print to PDF" -ErrorAction SilentlyContinue)) {
            Enable-WindowsOptionalFeature -Online -FeatureName Printing-PrintToPDFServices-Features -All -NoRestart
          }
          Get-Printer | Format-Table Name, DriverName, PortName
          Get-CimInstance Win32_Printer -Filter "Name='Microsoft Print to PDF'" | Invoke-CimMethod -MethodName SetDefaultPrinter
      - name: macOS printer
        if: runner.os == 'macOS'
        run: |
          brew install poppler
          sudo cupsctl FileDevice=Yes
          sudo lpadmin -p FileOut -E -v file:///tmp/newpub-print.pdf -m raw
          sudo lpadmin -d FileOut
          lpstat -t || true
      - name: real print
        shell: bash
        env:
          NEWPUB_REAL_PRINT: "1"
        run: |
          out="${RUNNER_TEMP}/newpub-print.pdf"
          [ "$RUNNER_OS" = macOS ] && out=/tmp/newpub-print.pdf
          export NEWPUB_PRINT_OUTPUT="$out"
          ./target/release/newpub-journeys --root journeys/conformance --out target/native-print --filter UI-PR-101
          for _ in $(seq 1 60); do [ -s "$out" ] && break; sleep 1; done
          if [ ! -s "$out" ]; then
            echo "no print output at $out"
            [ "$RUNNER_OS" = macOS ] && { lpstat -W all -o || true; sudo tail -50 /var/log/cups/error_log || true; }
            exit 1
          fi
          ls -l "$out"
          head -c 5 "$out" | grep -q '%PDF-'
          if [ "$RUNNER_OS" = macOS ]; then
            pdftotext "$out" - | tee /dev/stderr | grep -q "Printed by newpub"
          fi
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: journey-results-windows
          path: ci-results/windows
      - name: XPS opened by Windows' XPS reader
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -AssemblyName ReachFramework, PresentationCore, WindowsBase
          $path = (Resolve-Path "ci-results/windows/J-EX-006/news.xps").Path
          $doc = New-Object System.Windows.Xps.Packaging.XpsDocument($path, [System.IO.FileAccess]::Read)
          $pages = $doc.GetFixedDocumentSequence().DocumentPaginator.PageCount
          $doc.Close()
          Write-Output "news.xps: $pages pages"
          if ($pages -lt 1) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-print-${{ matrix.label }}
          path: target/native-print
          if-no-files-found: warn

  dashboard:
    needs: [journeys, conformance, native-print]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ci-results
          pattern: journey-results-*
      - name: build dashboard
        run: python3 tools/dashboard/build.py --results ci-results --out dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dashboard
      - uses: actions/deploy-pages@v4
        id: deploy
        continue-on-error: true
