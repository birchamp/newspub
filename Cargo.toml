[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/layout",
    "crates/render",
    "crates/io-pdf",
    "crates/io-native",
    "crates/io-pub",
    "crates/io-html",
    "crates/io-metafile",
    "crates/spell",
    "crates/engine",
    "crates/app",
    "crates/journeys",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
newpub-core = { path = "crates/core" }
newpub-layout = { path = "crates/layout" }
newpub-render = { path = "crates/render" }
newpub-io-pdf = { path = "crates/io-pdf" }
newpub-io-native = { path = "crates/io-native" }
newpub-io-pub = { path = "crates/io-pub" }
newpub-io-html = { path = "crates/io-html" }
newpub-io-metafile = { path = "crates/io-metafile" }
newpub-spell = { path = "crates/spell" }
newpub-engine = { path = "crates/engine" }
newpub-app = { path = "crates/app" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
anyhow = "1"
rustybuzz = "0.20"
ttf-parser = "0.25"
fontdb = "0.24"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
hyphenation = { version = "0.8", features = ["embed_en-us"] }
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
krilla = "0.8"
lopdf = { version = "0.45", default-features = false }
hayro = "0.8"
zip = { version = "8", default-features = false, features = ["deflate"] }
cfb = "0.15"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.36"
egui_kittest = "0.36"
rfd = "0.17"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
